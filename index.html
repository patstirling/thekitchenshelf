<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Kitchen Shelf - Hay-on-Wye</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Oswald:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    // Runs before body paints, so the right colour/logo are set from frame one.
    (function () {
      var palette = [
        { bg: '#C65B59', text: '#ffffff', logo: 'logo-landscape-white.png' },
        { bg: '#E4C551', text: '#ffffff', logo: 'logo-landscape-white.png' },
        { bg: '#317189', text: '#ffffff', logo: 'logo-landscape-white.png' },
        { bg: '#4189A6', text: '#ffffff', logo: 'logo-landscape-white.png' }
      ];
      var choice = palette[Math.floor(Math.random() * palette.length)];
      window.__choice = choice;
      window.__palette = palette;
      document.documentElement.style.setProperty('--bg', choice.bg);
      document.documentElement.style.setProperty('--text', choice.text);
    })();
  </script>
  <style>
    html, body {
      margin: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: 6vh 1.25rem 4vh;
      box-sizing: border-box;
      gap: clamp(0.6rem, 2vh, 1.1rem);
    }
    .logo {
      width: clamp(230px, 42vw, 440px);
      height: auto;
      aspect-ratio: 900 / 390;
      margin-bottom: clamp(0.5rem, 2vh, 1.25rem);
    }
    h1 {
      font-family: 'Londrina Solid', cursive;
      font-weight: 400;
      font-size: clamp(1.75rem, 5.5vw, 3.1rem);
      line-height: 1.1;
      letter-spacing: 0.01em;
      margin: 0;
      max-width: 90vw;
    }
    .subhead {
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: clamp(0.95rem, 2.4vw, 1.3rem);
      margin: 0;
      max-width: 36rem;
    }
    .details {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      line-height: 1.7;
      margin: 0.5rem 0 0;
    }
    .details strong {
      font-weight: 500;
    }
    .insta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: inherit;
      text-decoration: none;
      margin-top: 0.3rem;
    }
    .insta svg {
      width: 1.2em;
      height: 1.2em;
    }
    .insta span {
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }
    .favourites {
      align-self: stretch;
      margin: clamp(1rem, 3vh, 2rem) -1.25rem 0;
      padding: 1.5rem 1.25rem;
      background: #ffffff;
    }
    /* Clips the widget's own plain-text "view all" link (tune the height if needed) */
    .widget {
      width: 900px;
      max-width: 100%;
      height: 375px;
      overflow: hidden;
      margin: 0 auto;
    }
    .viewall {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.7rem 1.6rem;
      background: var(--bg);
      color: #ffffff;
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 999px;
      transition: background-color 0.3s ease, transform 0.15s ease;
    }
    .viewall:hover {
      transform: translateY(-1px);
    }
    .favourites {
      text-align: center;
    }
    .favourites iframe {
      display: block;
      width: 900px;
      max-width: 100%;
      margin: 0 auto;
    }
    /* On narrow screens the widget shows its own button, so drop the clip and ours */
    @media (max-width: 640px) {
      .widget {
        height: auto;
        overflow: visible;
      }
      .viewall {
        display: none;
      }
    }
    .dots {
      display: flex;
      gap: 12px;
      margin-top: clamp(0.75rem, 2.5vh, 1.5rem);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .dot:hover {
      transform: scale(1.2);
    }
    .dot.active {
      transform: scale(1.35);
      box-shadow: 0 0 0 2px var(--text);
    }
  </style>
</head>
<body>
  <img class="logo" id="logo" alt="The Kitchen Shelf">

  <h1>A bookshop for people who love to cook</h1>
  <p class="subhead">New &amp; secondhand cookbooks with a drink-in coffee bar showcasing great home-style coffee and tea</p>

  <p class="details">
    <strong>Tuesday&ndash;Saturday, 10am&ndash;4pm</strong><br>
    St John&rsquo;s Place, Hay-on-Wye, HR3 5BN, Wales<br>
    01497 828093
  </p>

  <a class="insta" href="https://www.instagram.com/thekitchenshelfhay/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
      <circle cx="12" cy="12" r="4.5"/>
      <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/>
    </svg>
    <span>Follow us on Instagram</span>
  </a>

  <div class="favourites">
    <div class="widget">
    <script
    src="https://uk.bookshop.org/widgets.js"
    data-type="list"
    data-list-slug="our-all-time-favourites-the-kitchen-shelf"></script>
    </div>
    <a class="viewall" href="https://uk.bookshop.org/lists/our-all-time-favourites-the-kitchen-shelf" target="_blank" rel="noopener">View all our favourites</a>
  </div>

  <div class="favourites">
    <div class="widget">
    <script
    src="https://uk.bookshop.org/widgets.js"
    data-type="list"
    data-list-slug="coffee-company"></script>
    </div>
    <a class="viewall" href="https://uk.bookshop.org/lists/coffee-company" target="_blank" rel="noopener">View the full list</a>
  </div>

  <div class="dots" id="dots"></div>

  <script>
    var logoEl = document.getElementById('logo');
    logoEl.src = window.__choice.logo;

    var dotsEl = document.getElementById('dots');
    var dotEls = [];

    function applyChoice(c) {
      window.__choice = c;
      document.documentElement.style.setProperty('--bg', c.bg);
      document.documentElement.style.setProperty('--text', c.text);
      logoEl.src = c.logo;
      dotEls.forEach(function (d) {
        d.classList.toggle('active', d.dataset.bg === c.bg);
      });
    }

    window.__palette.forEach(function (c) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (c.bg === window.__choice.bg ? ' active' : '');
      dot.style.backgroundColor = c.bg;
      dot.dataset.bg = c.bg;
      dot.setAttribute('aria-label', 'Switch colour');
      dot.addEventListener('click', function () { applyChoice(c); });
      dotsEl.appendChild(dot);
      dotEls.push(dot);
    });
  </script>
</body>
</html>
