<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Runs before body paints, so the right colour/logo are set from frame one.
    (function () {
      var palette = [
        { bg: '#C8595A', text: '#ffffff', logo: 'logo-white.png' },
        { bg: '#E5C550', text: '#ffffff', logo: 'logo-white.png' },
        { bg: '#366F7A', text: '#ffffff', logo: 'logo-white.png' },
        { bg: '#408AA7', text: '#ffffff', logo: 'logo-white.png' }
      ];
      var choice = palette[Math.floor(Math.random() * palette.length)];
      window.__choice = choice;
      window.__palette = palette;
      document.documentElement.style.setProperty('--bg', choice.bg);
      document.documentElement.style.setProperty('--text', choice.text);
    })();
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: clamp(160px, 32vw, 320px);
      height: auto;
      aspect-ratio: 700 / 759;
    }
    h1 {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      font-size: clamp(1.25rem, 5.5vw, 2.75rem);
      font-weight: normal;
      letter-spacing: 0.02em;
      padding: 0 0.5rem;
      margin: 0;
      max-width: 96vw;
    }
    .dots {
      position: absolute;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .dot:hover {
      transform: scale(1.2);
    }
    .dot.active {
      transform: scale(1.35);
      box-shadow: 0 0 0 2px var(--text);
    }
  </style>
</head>
<body>
  <img class="logo" id="logo" alt="The Kitchen Shelf">
  <h1>Coming soon to a book town near you</h1>
  <div class="dots" id="dots"></div>

  <script>
    var logoEl = document.getElementById('logo');
    logoEl.src = window.__choice.logo;

    var dotsEl = document.getElementById('dots');
    var dotEls = [];

    function applyChoice(c) {
      window.__choice = c;
      document.documentElement.style.setProperty('--bg', c.bg);
      document.documentElement.style.setProperty('--text', c.text);
      logoEl.src = c.logo;
      dotEls.forEach(function (d) {
        d.classList.toggle('active', d.dataset.bg === c.bg);
      });
    }

    window.__palette.forEach(function (c) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (c.bg === window.__choice.bg ? ' active' : '');
      dot.style.backgroundColor = c.bg;
      dot.dataset.bg = c.bg;
      dot.setAttribute('aria-label', 'Switch colour');
      dot.addEventListener('click', function () { applyChoice(c); });
      dotsEl.appendChild(dot);
      dotEls.push(dot);
    });
  </script>
</body>
</html>
